# GPT2 baseline for Stage1 pass-based rainfall retrieval.

data:
  db_path: "/home/wdz/satellite_data/satellite_data.db"
  pass_dataset_path: "/home/wdz/BT/Stage1/rain_retrieval/model/data/datasets/pass_dataset_rain_retrieval_20260626_1804.npz"
  data_split: [0.7, 0.2, 0.1]
  val_strategy: "stratified_before_test"
  num_workers: 0
  strict_source_filters: false
  rain_filter_min: 0.0
  satellite_filter_ids: []

checkpoints: "/home/wdz/BT/Stage1/gpt2_rain_retrieval/checkpoints/gpt2_rain"

features:
  enabled_groups:
    - link
    - position
    - ground_weather
    - image_weather
    - dry_delta
  link:
    - phyRssi
    - rssi
    - snr
    - lastCniValue
  position:
    - longitude
    - latitude
    - satAltitude
    - posLongitude
    - posLatitude
    - altitude
    - slant_range_km
    - elevation_deg
    - azimuth_sin
    - azimuth_cos
  ground_weather:
    - temperature
    - humidity
    - pressure

image_weather:
  enabled: true
  csv_path: "/home/wdz/BT/Stage1/rain_retrieval/data/camera_labels/latest_weather_labels_slim.csv"
  tolerance: "10min"

dry_baseline:
  enabled: true
  rain_threshold: 1e-6
  method: "mean"
  add_summary: false
  exclude_instant_rain: true
  exclude_image_rain: true
  image_rain_prob_threshold: 0.2
  require_image_available: false
  min_sunny_prob: 0.0
  time_scale_hours: 72.0
  time_weight: 1.0
  position_weight: 1.0

targets:
  primary:
    - pass_rainfall_mm
  auxiliary:
    - rain_rate_mean
    - rain_rate_max
    - rainy_ratio

model:
  input_dim: 25
  feature_group_dims: [4, 10, 3, 4, 4]
  max_seq_len: 256
  patch_len: 8
  stride: 4
  dropout: 0.1
  num_satellites: 260
  sat_emb_dim: 16
  use_summary_token: true
  nonnegative_rainfall: true

  gpt2_model_dir: "/home/wdz/BT/Stage2/GPT4TS/Long-term_Forecasting/gpt2"
  local_files_only: true
  gpt2_layers: 6
  freeze_gpt2: "all"       # all / ln_wpe / none
  torch_dtype: "float32"   # float32 / float16 / bfloat16

training:
  seed: 42
  iterations: 3
  batch_size: 32
  epochs: 100
  lr: 1e-4
  weight_decay: 1e-5
  patience: 15
  rainfall_loss_weight: 2.0
  rain_threshold: 1e-6
  rainy_loss_weight: 20.0
  rain_classification_loss_weight: 0.5
  rain_classification_pos_weight: 20.0
  auxiliary_loss_weight: 0.3
  use_rainy_sampler: true
  rainy_sample_weight: 20.0
  grad_clip: 1.0
  use_cosine: true
  tmax: 20
  lradj: "type1"
  decay_fac: 0.9
